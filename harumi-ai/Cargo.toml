[package]
name = "harumi-ai"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
description = "AI-powered PDF translation orchestration built on harumi — new-PDF generation, PSPDFKit-compatible"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/harumi"
keywords = ["pdf", "translation", "ai", "llm", "cjk"]
categories = ["text-processing"]

[dependencies]
harumi = { path = "..", version = "1.19", features = ["draw"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "process", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
regex = "1"

# optional HTTP client for built-in providers
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }

# optional CJK OCR backend
ocrs-cjk = { version = "0.1", optional = true }

[features]
default = []
openai      = ["dep:reqwest"]
anthropic   = ["dep:reqwest", "dep:base64"]
ocr-backend = ["dep:ocrs-cjk"]

[[example]]
name = "translate_pdf"
required-features = ["anthropic"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
