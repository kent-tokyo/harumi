name: CI

on:
  push:
    branches: [master, main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/fixtures/**"
      - "!LICENSE-*"
  pull_request:
    branches: [master, main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/fixtures/**"
      - "!LICENSE-*"

# A new push to the same PR cancels its older, now-stale run so it stops
# holding runner slots. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Jobs are deliberately few: with several PRs open at once, the runner
# concurrency limit (not job duration) dominated wall-clock time. Add new
# checks as steps of an existing job rather than as new jobs.
jobs:
  test:
    name: Test, Clippy and dependency boundaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        if: ${{ !cancelled() }}
        run: cargo test --all-features
      - name: Build examples
        if: ${{ !cancelled() }}
        run: cargo build --examples
      - name: Clippy (all features)
        if: ${{ !cancelled() }}
        run: cargo clippy --all-features -- -D warnings
      - name: Reject unmaintained font parser from SVG graph
        if: ${{ !cancelled() }}
        run: bash scripts/check-svg-dependency-boundary.sh

  wasm:
    name: WASM build, test and dependency boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Verify WASM demo lockfile
        run: cargo metadata --manifest-path wasm-demo/Cargo.toml --locked --format-version 1
      - name: Reject native runtime dependencies from WASM graph
        if: ${{ !cancelled() }}
        run: bash scripts/check-wasm-deps.sh
      - name: Build (wasm32, default features)
        if: ${{ !cancelled() }}
        run: cargo build --target wasm32-unknown-unknown
      - name: Build (wasm32, draw+ocr+flow features)
        if: ${{ !cancelled() }}
        run: cargo build --target wasm32-unknown-unknown --features draw,ocr,flow
      - name: Test (Node.js runner, no browser needed)
        if: ${{ !cancelled() }}
        run: wasm-pack test --node -- --test wasm_smoke

  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check semver (default features)
        run: cargo semver-checks
      - name: Check semver (all features)
        if: ${{ !cancelled() }}
        run: cargo semver-checks --all-features

  fixtures:
    name: Fixture and renderer contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The fixture tools are separate workspaces; one shared target dir lets
      # them reuse the harumi build and keeps it in a single cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Poppler utilities
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Bulk extraction evidence contract
        if: ${{ !cancelled() }}
        run: bash scripts/check-bulk-extraction-fixture.sh
      - name: PDF specification coverage (Poppler)
        if: ${{ !cancelled() }}
        run: bash scripts/check-pdf-spec-coverage-render.sh
      - name: Report generation renderer artifacts
        if: ${{ !cancelled() }}
        run: bash scripts/check-report-generation-fixture.sh
      - name: SVG visual render contract
        if: ${{ !cancelled() }}
        run: bash scripts/check-svg-render-fixture.sh
      - name: Pdfium runner compile contract
        if: ${{ !cancelled() }}
        run: PDFIUM_COMPILE_ONLY=1 bash scripts/check-pdfium-render-fixture.sh
      - name: Upload bulk extraction artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bulk-extraction-corpus
          path: /tmp/harumi-bulk-extraction-fixture
          if-no-files-found: error
      - name: Upload specification corpus artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-spec-coverage-poppler
          path: /tmp/harumi-pdf-spec-coverage
          if-no-files-found: error
      - name: Upload report generation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-generation-poppler
          path: /tmp/harumi-report-generation-fixture
          if-no-files-found: error
      - name: Upload SVG render artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-render-poppler
          path: /tmp/harumi-svg-render-fixture
          if-no-files-found: error

  pdfium-runtime:
    name: Pdfium pinned runtime artifact
    if: ${{ vars.HARUMI_PDFIUM_LIBRARY_URL != '' && vars.HARUMI_PDFIUM_LIBRARY_SHA256 != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Download pinned Pdfium library
        env:
          PDFIUM_URL: ${{ vars.HARUMI_PDFIUM_LIBRARY_URL }}
          PDFIUM_SHA256: ${{ vars.HARUMI_PDFIUM_LIBRARY_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/harumi-pdfium-runtime
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$PDFIUM_URL" --output /tmp/harumi-pdfium-runtime/libpdfium.so
          printf '%s  %s\n' "$PDFIUM_SHA256" /tmp/harumi-pdfium-runtime/libpdfium.so \
            | sha256sum --check --status
      - name: Render pinned Pdfium fixture
        env:
          PDFIUM_LIBRARY_PATH: /tmp/harumi-pdfium-runtime/libpdfium.so
          PDFIUM_LIBRARY_SHA256: ${{ vars.HARUMI_PDFIUM_LIBRARY_SHA256 }}
        run: |
          bash scripts/check-pdfium-render-fixture.sh \
            examples/fixtures/scanned_sample.pdf \
            /tmp/harumi-pdfium-runtime/page-1.png \
            0 1600 \
            /tmp/harumi-pdfium-runtime/report.json
      - name: Upload Pdfium runtime artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdfium-pinned-runtime
          path: /tmp/harumi-pdfium-runtime
          if-no-files-found: ignore
          retention-days: 14
