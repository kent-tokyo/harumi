name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crates when versions are missing
        run: |
          set -euo pipefail

          publish_if_missing() {
            local package="$1"
            local version
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg package "$package" '.packages[] | select(.name == $package) | .version')"
            if cargo info "${package}@${version}" --registry crates-io >/dev/null 2>&1; then
              echo "$package $version is already published; skipping"
            else
              cargo publish -p "$package" --no-verify
            fi
          }

          publish_if_missing harumi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # harumi-ai depends on harumi; give crates.io a moment to index the new version.
      - name: Wait for harumi to be indexed
        run: sleep 20

      - name: Publish harumi-ai when the version is missing
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "harumi-ai") | .version')"

          if cargo info "harumi-ai@${version}" --registry crates-io >/dev/null 2>&1; then
            echo "harumi-ai $version is already published; skipping"
          else
            cargo publish -p harumi-ai --no-verify
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
