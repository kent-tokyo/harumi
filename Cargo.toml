[workspace]
members = [".", "harumi-mcp"]

[package]
name = "harumi"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
description = "Pure-Rust PDF — CJK font embedding (Chinese/Japanese/Korean), OCR text overlay, text extraction, HTML→PDF, page merge/split. WASM-ready, zero C deps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/harumi"
homepage = "https://kent-tokyo.github.io/harumi/"
documentation = "https://docs.rs/harumi"
readme = "crates-io.md"
keywords = ["pdf", "cjk", "ocr", "wasm", "rag"]
categories = ["rendering::data-formats", "text-processing", "parser-implementations", "multimedia::images", "wasm"]

[dependencies]
lopdf = "0.40"
ttf-parser = "0.25"
png = { version = "0.17", optional = true }

[features]
default = []
draw = []
image = ["dep:png", "draw"]
ocr = []
flow = ["draw"]
html = ["flow"]

# getrandom is needed for AES-256 key generation. Backend differs per target family.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# wasm32-unknown-unknown (browser/Node.js) requires the wasm_js backend.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
lopdf = "0.40"
ttf-parser = "0.25"
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
