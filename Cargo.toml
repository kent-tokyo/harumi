[package]
name = "harumi"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
description = "Overlay searchable CJK text on PDFs, extract text, merge/split pages — pure Rust, zero C dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/harumi"
homepage = "https://github.com/kent-tokyo/harumi"
documentation = "https://docs.rs/harumi"
readme = "README.md"
keywords = ["pdf", "cjk", "japanese", "ocr", "font"]
categories = ["encoding", "text-processing"]

[dependencies]
lopdf = "0.40"
allsorts = "0.17"
ttf-parser = "0.25"
thiserror = "2"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
scraper = { version = "0.19", optional = true }

[features]
default = []
draw = []
image = ["dep:image", "draw"]
ocr = []
flow = ["draw"]
html = ["flow", "dep:scraper"]

[dev-dependencies]
lopdf = "0.40"
