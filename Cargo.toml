[package]
name = "harumi"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
description = "Pure Rust PDF library: CJK text overlay (Chinese / Japanese / Korean), AI/RAG text chunking, HTML→PDF, page operations — WASM-ready, zero C deps"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/harumi"
homepage = "https://kent-tokyo.github.io/harumi/"
documentation = "https://docs.rs/harumi"
readme = "README.md"
keywords = ["pdf", "cjk", "japanese", "wasm", "rag"]
categories = ["encoding", "text-processing", "parser-implementations", "multimedia::images", "wasm"]

[dependencies]
lopdf = "0.40"
subsetter = "0.2"
ttf-parser = "0.25"
thiserror = "2"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
scraper = { version = "0.19", optional = true }
cms = { version = "0.2", optional = true }
x509-cert = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
rsa = { version = "0.9", optional = true }
der = { version = "0.7", optional = true }

[features]
default = []
draw = []
image = ["dep:image", "draw"]
ocr = []
flow = ["draw"]
html = ["flow", "dep:scraper"]
digital-signature = ["dep:cms", "dep:x509-cert", "dep:sha2", "dep:rsa", "dep:der"]

# getrandom is needed for AES-256 key generation. Backend differs per target family.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# wasm32-unknown-unknown (browser/Node.js) requires the wasm_js backend.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
lopdf = "0.40"
ttf-parser = "0.25"
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
