[package]
name = "harumi"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
description = "Overlay searchable CJK text on PDFs, extract text, merge/split pages — pure Rust, zero C dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/harumi"
homepage = "https://github.com/kent-tokyo/harumi"
documentation = "https://docs.rs/harumi"
readme = "README.md"
keywords = ["pdf", "cjk", "japanese", "ocr", "font"]
categories = ["encoding", "text-processing"]

[dependencies]
lopdf = "0.40"
allsorts = { version = "0.17", default-features = false, features = ["flate2_rust"] }
ttf-parser = "0.25"
thiserror = "2"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
scraper = { version = "0.19", optional = true }

[features]
default = []
draw = []
image = ["dep:image", "draw"]
ocr = []
flow = ["draw"]
html = ["flow", "dep:scraper"]

# getrandom is needed for AES-256 key generation. Backend differs per target family.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# wasm32-unknown-unknown (browser/Node.js) requires the wasm_js backend.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
lopdf = "0.40"
ttf-parser = "0.25"
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
