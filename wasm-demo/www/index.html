<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>harumi WASM demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 1.5rem;
      width: 100%;
      max-width: 540px;
    }
    .field { margin-bottom: 1.1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem; }
    input[type="file"], input[type="text"], input[type="number"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input[type="file"] { cursor: pointer; }
    .modes { display: flex; gap: 0.75rem; margin-bottom: 1.1rem; }
    .mode-btn {
      flex: 1;
      padding: 0.55rem;
      border: 1.5px solid #ddd;
      background: white;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-btn.active { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .coords { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    #coords-row { display: none; }
    button#run {
      width: 100%;
      padding: 0.7rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#run:hover:not(:disabled) { background: #2563eb; }
    button#run:disabled { background: #93c5fd; cursor: not-allowed; }
    #status { margin-top: 1rem; font-size: 0.9rem; color: #555; min-height: 1.4rem; text-align: center; }
    #status.error { color: #dc2626; }
    #status.ok { color: #16a34a; }
    #download-row { margin-top: 1rem; display: none; justify-content: center; }
    #download-btn {
      padding: 0.55rem 1.5rem;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    #download-btn:hover { background: #15803d; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 0.25rem; }
    .font-badge {
      display: inline-block;
      font-size: 0.75rem;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      margin-left: 0.4rem;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <h1>harumi WASM demo</h1>
  <p class="subtitle">Pure-Rust PDF processing — running entirely in your browser</p>

  <div class="card">
    <div class="field">
      <label>PDF file</label>
      <input type="file" id="pdf-file" accept=".pdf">
    </div>

    <div class="field">
      <label>
        Font file
        <span class="font-badge" id="font-badge">built-in (Hack, Latin)</span>
      </label>
      <input type="file" id="font-file" accept=".ttf,.otf,.ttc">
      <p class="hint">Optional — leave blank to use the built-in font. Upload a CJK font (e.g. Noto Sans JP) for Japanese/Chinese/Korean.</p>
    </div>

    <div class="field">
      <label>Mode</label>
      <div class="modes">
        <button class="mode-btn active" id="mode-stamp" onclick="setMode('stamp')">Stamp text</button>
        <button class="mode-btn" id="mode-ocr" onclick="setMode('ocr')">OCR layer</button>
      </div>
    </div>

    <div class="field">
      <label id="text-label">Stamp text</label>
      <input type="text" id="text-input" value="DRAFT" placeholder="Text to overlay">
    </div>

    <div class="field" id="coords-row">
      <label>Position (points, origin bottom-left)</label>
      <div class="coords">
        <div>
          <label style="font-weight:400">X</label>
          <input type="number" id="x-input" value="72" step="1">
        </div>
        <div>
          <label style="font-weight:400">Y</label>
          <input type="number" id="y-input" value="72" step="1">
        </div>
      </div>
    </div>

    <button id="run" onclick="run()" disabled>Process PDF</button>
    <div id="status"></div>
    <div id="download-row">
      <a id="download-btn" href="#" download="output.pdf">Download output.pdf</a>
    </div>
  </div>

  <script type="module">
    import init, { stamp_pdf, ocr_layer, page_count } from './pkg/harumi_wasm_demo.js';

    let mode = 'stamp';
    let wasmReady = false;
    let defaultFontBytes = null;

    async function boot() {
      setStatus('Loading WASM…');
      await init();
      wasmReady = true;
      document.getElementById('run').disabled = false;
      setStatus('Ready.');

      // Pre-fetch the built-in font in the background (cached after first load).
      fetch('./fonts/Hack-Regular.ttf')
        .then(r => r.arrayBuffer())
        .then(buf => { defaultFontBytes = new Uint8Array(buf); })
        .catch(() => {});
    }

    // Update font badge when a custom font is selected or cleared.
    document.getElementById('font-file').addEventListener('change', function() {
      const badge = document.getElementById('font-badge');
      if (this.files[0]) {
        badge.textContent = this.files[0].name;
        badge.style.background = '#f0fdf4';
        badge.style.color = '#15803d';
        badge.style.borderColor = '#bbf7d0';
      } else {
        badge.textContent = 'built-in (Hack, Latin)';
        badge.style.background = '';
        badge.style.color = '';
        badge.style.borderColor = '';
      }
    });

    window.setMode = function(m) {
      mode = m;
      document.getElementById('mode-stamp').classList.toggle('active', m === 'stamp');
      document.getElementById('mode-ocr').classList.toggle('active', m === 'ocr');
      document.getElementById('text-label').textContent = m === 'stamp' ? 'Stamp text' : 'Invisible OCR text';
      document.getElementById('coords-row').style.display = m === 'ocr' ? 'block' : 'none';
    };

    window.run = async function() {
      if (!wasmReady) return;

      const pdfFile = document.getElementById('pdf-file').files[0];
      const fontFile = document.getElementById('font-file').files[0];
      const text = document.getElementById('text-input').value.trim();

      if (!pdfFile) { setStatus('Please select a PDF file.', 'error'); return; }
      if (!text) { setStatus('Please enter text.', 'error'); return; }

      setStatus('Processing…');
      document.getElementById('run').disabled = true;
      document.getElementById('download-row').style.display = 'none';

      try {
        let fontBytes;
        if (fontFile) {
          fontBytes = new Uint8Array(await fontFile.arrayBuffer());
        } else if (defaultFontBytes) {
          fontBytes = defaultFontBytes;
        } else {
          // Not yet cached — fetch now.
          const r = await fetch('./fonts/Hack-Regular.ttf');
          if (!r.ok) throw new Error('Built-in font unavailable. Please upload a font file.');
          defaultFontBytes = new Uint8Array(await r.arrayBuffer());
          fontBytes = defaultFontBytes;
        }

        const pdf = new Uint8Array(await pdfFile.arrayBuffer());

        let result;
        if (mode === 'stamp') {
          result = stamp_pdf(pdf, fontBytes, text);
        } else {
          const x = parseFloat(document.getElementById('x-input').value) || 72;
          const y = parseFloat(document.getElementById('y-input').value) || 72;
          result = ocr_layer(pdf, fontBytes, text, x, y);
        }

        const pages = page_count(result);
        const blob = new Blob([result], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const dl = document.getElementById('download-btn');
        dl.href = url;
        dl.download = pdfFile.name.replace(/\.pdf$/i, '') + '_harumi.pdf';
        document.getElementById('download-row').style.display = 'flex';
        setStatus(`Done — ${pages} page${pages !== 1 ? 's' : ''}.`, 'ok');
      } catch (e) {
        setStatus('Error: ' + e, 'error');
      } finally {
        document.getElementById('run').disabled = false;
      }
    };

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls || '';
    }

    boot();
  </script>
</body>
</html>
